name: Generate Perak Daily Post

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate post dengan Claude AI
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 generate_post.py

      - name: Commit queue.json
        run: |
          git config user.name "NEXUS Bot"
          git config user.email "nexus@dealsense.my"
          git add queue.json
          git diff --staged --quiet || git commit -m "Auto post Perak $(date +'%d/%m/%Y')"
          git push
