name: Generate Perak Daily Post

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate post dengan Claude AI
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 << 'EOF'
          import urllib.request
          import urllib.error
          import json
          import os
          from datetime import datetime

          api_key = os.environ.get('ANTHROPIC_API_KEY', '')
          if not api_key:
              print("ERROR: Tiada API key!")
              exit(1)

          today = datetime.now().strftime("%A, %d %B %Y")
          prompt = f"""Hari ini {today}. Jana satu post Facebook lengkap untuk group Perak Kamuniti Malaysia.

WAJIB ikut susunan dan format ini:

BERITA PERAK HARI INI
[Cari dan tulis 1 berita paling penting hari ini dari Perak]
Sumber: [link artikel asal]
hashtag berkaitan berita

KISAH VIRAL PERAK
[Cari dan tulis 1 kisah viral/menarik dari Perak]
Sumber: [link jika ada]
hashtag berkaitan kisah

JAWATAN KOSONG PERAK
[Cari 2-3 jawatan kosong terkini di Perak]
Untuk setiap jawatan WAJIB ada:
- Nama syarikat
- Nama jawatan
- Lokasi (daerah di Perak)
- Link apply (JobStreet/Maukerja/Indeed)

Hashtag keseluruhan berkaitan semua info + #PerakKamuniti #Perak #Malaysia #InfoPerak #KerjaPerak #BeritaPerak

Tulis dalam Bahasa Melayu santai dengan emoji menarik."""

          payload = {
              "model": "claude-haiku-4-5-20251001",
              "max_tokens": 2000,
              "system": "Anda adalah NEXUS Perak Kamuniti Agent. Jana post Facebook menarik untuk group Perak Kamuniti. Ikut format yang diberikan dengan tepat. Sertakan link sumber berita dan link apply kerja yang betul.",
              "messages": [{"role": "user", "content": prompt}]
          }

          req = urllib.request.Request(
              "https://api.anthropic.com/v1/messages",
              data=json.dumps(payload).encode(),
              headers={
                  "Content-Type": "application/json",
                  "x-api-key": api_key,
                  "anthropic-version": "2023-06-01"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(req) as resp:
                  data = json.loads(resp.read())
                  reply = " ".join(i["text"] for i in data.get("content", []) if i.get("type") == "text")

              try:
                  with open("queue.json", "r", encoding="utf-8") as f:
                      queue = json.load(f)
              except:
                  queue = []

              new_post = {
                  "id": int(datetime.now().timestamp() * 1000),
                  "content": reply,
                  "type": "daily",
                  "date": datetime.now().strftime("%d/%m/%Y %H:%M"),
                  "done": False
              }
              queue.insert(0, new_post)
              queue = queue[:30]

              with open("queue.json", "w", encoding="utf-8") as f:
                  json.dump(queue, f, ensure_ascii=False, indent=2)

              print(f"Post berjaya dijana: {len(reply)} chars")
              print(reply[:300])

          except urllib.error.HTTPError as e:
              body = e.read().decode()
              print(f"HTTP Error {e.code}: {body}")
              exit(1)
          except Exception as e:
              print(f"Error: {e}")
              exit(1)
          EOF

      - name: Commit queue.json
        run: |
          git config user.name "NEXUS Bot"
          git config user.email "nexus@dealsense.my"
          git add queue.json
          git diff --staged --quiet || git commit -m "Auto post Perak $(date +'%d/%m/%Y')"
          git push
